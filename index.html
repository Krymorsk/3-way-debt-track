<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Splitwise Trio</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="container">

        <h1 class="title">
            Splitwise Trio
        </h1>

        <p class="subtitle">
            Choose your profile
        </p>

        <!-- ========================= -->
        <!-- Profile Cards -->
        <!-- ========================= -->

        <section class="profiles" id="profiles">

            <div class="profile" data-user="arish">

                <div class="avatar arish">
                    A
                </div>

                <div class="profile-info">

                    <div class="profile-name">
                        Arish
                    </div>

                    <div class="profile-desc">
                        Tap to continue
                    </div>

                </div>

            </div>

            <div class="profile" data-user="ayman">

                <div class="avatar ayman">
                    A
                </div>

                <div class="profile-info">

                    <div class="profile-name">
                        Ayman
                    </div>

                    <div class="profile-desc">
                        Tap to continue
                    </div>

                </div>

            </div>

            <div class="profile" data-user="vishist">

                <div class="avatar vishist">
                    V
                </div>

                <div class="profile-info">

                    <div class="profile-name">
                        Vishist
                    </div>

                    <div class="profile-desc">
                        Tap to continue
                    </div>

                </div>

            </div>

        </section>

        <!-- ========================= -->
        <!-- Login Panel -->
        <!-- ========================= -->

        <section class="login-panel hidden" id="loginPanel">

            <button
                class="back-btn"
                id="backBtn">

                ← Change Profile

            </button>

            <div class="selected-user">

                <div
                    class="avatar"
                    id="selectedAvatar">

                    A

                </div>

                <div>

                    <h2 id="selectedName">
                        Arish
                    </h2>

                    <p class="profile-desc">
                        Enter your password
                    </p>

                </div>

            </div>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password">

            <button
                class="login-btn"
                id="loginBtn">

                Login

            </button>

            <p
                id="errorMessage"
                class="error-message">

            </p>

        </section>

    </main>

    <script type="module" src="login.js"></script>

</body>

</html>
